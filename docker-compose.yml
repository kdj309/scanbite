services:
  mongo:
    image: mongo:7
    ports:
      # Host 27018 avoids a local mongod already bound to 127.0.0.1:27017.
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: foodscanner
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Official minio/minio currently 401s from this host. Bitnami is S3-compatible
    # and creates MINIO_DEFAULT_BUCKETS on boot.
    # Pin pre-2025.5.24: that release dropped the embedded console, so :9001
    # was mapped but nothing listened (API on :9000 still worked).
    image: bitnamilegacy/minio:2025.4.22
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: miniokdj
      MINIO_ROOT_PASSWORD: miniokdj@4905
      MINIO_DEFAULT_BUCKETS: foodscanner-labels
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo_data:
  redis_data:
  minio_data:
