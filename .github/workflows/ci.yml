name: CI

on:
  push:
    branches: [main]
  pull_request:

# No service containers needed — the test suite uses fakes for Redis/Mongo,
# not live connections (see apps/api/src/**/*.test.ts).
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0" # skip git-hook install, not relevant in CI
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test (api)
        run: pnpm --filter api test
