name: CI

on:
  push:
    branches: [main]
  pull_request:

# Unit tests (*.test.ts) use fakes only. Integration tests (*.itest.ts) run
# against the Mongo + Redis service containers below.
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0" # skip git-hook install, not relevant in CI
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test (api)
        run: pnpm --filter api test

      - name: Integration test (api)
        run: pnpm --filter api test:integration
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/foodscanner_test
          REDIS_URL: redis://127.0.0.1:6379
